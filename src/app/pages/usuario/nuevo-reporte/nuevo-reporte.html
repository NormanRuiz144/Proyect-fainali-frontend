<section class="portal-ciudadano">
  <div class="contenedor-formulario">
    <div class="encabezado-portal">
      <div class="icono-portal">
        <i class="fa-solid fa-bullhorn"></i>
      </div>
      <h2>Reportar un Problema</h2>
      <p>Ayúdanos a mejorar nuestra comunidad. Completa la información y resolveremos la incidencia lo más pronto posible.</p>
    </div>

    <form class="formulario-reporte" (submit)="enviarReporte($event)">
      
      <!-- Paso 1: Tipo de Problema -->
      <div class="grupo-campo">
        <label for="problematica"><i class="fa-solid fa-triangle-exclamation"></i> ¿Qué tipo de problema es?</label>
        <select id="problematica" class="input-portal" required (change)="cambiarPlaceholder($event)">
          <option value="" disabled selected>Selecciona una opción...</option>
          <option *ngFor="let prob of problematicas()" [value]="prob.id">{{ prob.problema }}</option>
        </select>
      </div>

      <!-- Paso 2: Descripción -->
      <div class="grupo-campo">
        <label for="descripcion"><i class="fa-solid fa-align-left"></i> Brinda más detalles (Descripción)</label>
        <textarea id="descripcion" class="input-portal textarea-portal" [placeholder]="placeholderActual()" required rows="3"></textarea>
      </div>

      <!-- Paso 3: Institución a la que va dirigido -->
      <div class="grupo-campo">
        <label for="institucion"><i class="fa-solid fa-building-flag"></i> ¿A qué institución va dirigido?</label>
        <select id="institucion" class="input-portal" required [value]="institucionSeleccionada()" (change)="institucionSeleccionada.set($any($event.target).value)">
          <option value="" disabled selected>Selecciona la institución responsable...</option>
          <option *ngFor="let inst of instituciones()" [value]="inst.id.toString()">{{ inst.nombreInstitucion }}</option>
        </select>
      </div>

      <!-- Paso 4: Municipio (Filtro) -->
      <div class="grupo-campo">
        <label for="municipio"><i class="fa-solid fa-city"></i> ¿En qué municipio te encuentras?</label>
        <select id="municipio" class="input-portal" required (change)="onMunicipioChange($event)">
          <option value="" disabled selected>Selecciona tu municipio...</option>
          <option *ngFor="let mun of municipios()" [value]="mun.id">{{ mun.nomMunicipio }}</option>
        </select>
      </div>

      <!-- Paso 5: Sector -->
      <div class="grupo-campo">
        <label for="sector"><i class="fa-solid fa-map"></i> ¿En qué sector/barrio ocurrió?</label>
        <select id="sector" class="input-portal" required [disabled]="!municipioSeleccionado()">
          <option value="" disabled selected>Selecciona tu barrio o sector...</option>
          <option *ngFor="let sec of sectores()" [value]="sec.id">{{ sec.nombreSector }}</option>
        </select>
      </div>

      <!-- Paso 4: GPS y Mapa -->
      <div class="grupo-campo">
        <label><i class="fa-solid fa-location-crosshairs"></i> Ubicación Exacta (GPS)</label>
        <div class="contenedor-mapa">
          
          <div class="estado-gps">
            <button type="button" class="btn-gps" (click)="obtenerUbicacion()">
              <i class="fa-solid fa-satellite-dish"></i> Obtener mi ubicación actual
            </button>
            <span class="texto-coordenadas" *ngIf="ubicacionObtenida()">¡Ubicación capturada con éxito!</span>
          </div>

          <div id="mapa-ubicacion" style="height: 300px; width: 100%; z-index: 1;"></div>
        </div>
      </div>

      <!-- Paso 5: Evidencia Fotográfica -->
      <div class="grupo-campo">
        <label><i class="fa-solid fa-camera"></i> Evidencia Fotográfica</label>
        <div class="zona-archivos">
          <i class="fa-solid fa-cloud-arrow-up icono-subida"></i>
          <h4>Haz clic o arrastra tus fotos aquí</h4>
          <p>Sube hasta 6 imágenes del problema (JPG, PNG). Máximo 20MB.</p>
          <input type="file" id="archivos-evidencia" multiple accept="image/png, image/jpeg, image/webp" class="input-archivo-oculto" (change)="onFileSelected($event)">
          <button type="button" class="btn-subir-falso">Seleccionar Archivos</button>
        </div>

        <!-- Contenedor de Previsualización de Imágenes -->
        <div class="contenedor-previsualizacion" *ngIf="imagenesPrevisualizacion().length > 0">
          <div class="tarjeta-previsualizacion" *ngFor="let img of imagenesPrevisualizacion(); let i = index" (click)="ampliarImagen(img.url)" title="Hacer clic para ver en grande">
            <img [src]="img.url" [alt]="img.name">
            <button type="button" class="btn-eliminar-foto" (click)="eliminarImagen(i); $event.stopPropagation()" title="Eliminar imagen">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="acciones-formulario">
        <button type="button" class="btn-portal-secundario">Cancelar</button>
        <button type="submit" class="btn-portal-primario">
          <i class="fa-solid fa-paper-plane"></i> Enviar Reporte
        </button>
      </div>

    </form>
  </div>

  <!-- Modal para ver la imagen ampliada (Lightbox) -->
  <div class="modal-imagen-overlay" *ngIf="imagenAmpliada()" (click)="cerrarModalImagen()">
    <div class="modal-imagen-contenedor" (click)="$event.stopPropagation()">
      <button type="button" class="btn-cerrar-modal" (click)="cerrarModalImagen()" title="Cerrar vista grande">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <img [src]="imagenAmpliada()" alt="Evidencia ampliada" class="imagen-ampliada">
    </div>
  </div>
</section>
